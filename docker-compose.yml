services:
  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  caddy:
    # Pinned: caddy sits in the request path, and `latest` meant a routine
    # `docker compose pull` could jump it a major version mid-deploy. Bump
    # deliberately, in its own window — never alongside an app release.
    image: caddy:2.11.4
    container_name: revel_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    # env_file so the Caddyfile's {$FRONTEND_DOMAIN}/{$API_DOMAIN}/... resolve.
    env_file:
      - .env
    volumes:
      # Default ./Caddyfile is the Cloudflare-aware variant (what prod uses).
      # Self-hosters NOT behind Cloudflare set CADDYFILE_PATH=./Caddyfile.generic
      # in .env (the wizard does this automatically).
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./media:/srv/revel_media
      - ./docs/site:/srv/docs:ro
      # Hosted geo datasets (worldcities.csv, IP2LOCATION-LITE-DB5.BIN, NOTICE)
      # served at /geo-data/* so self-hosters can fetch them at setup time.
      - ./geo-data:/srv/geo-data:ro
    networks:
      - revel_network

  # ============================================================================
  # Application Services
  # ============================================================================

  web:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      gunicorn revel.wsgi:application
      --worker-class gthread
      --workers ${GUNICORN_WORKERS:-6}
      --threads ${GUNICORN_THREADS:-4}
      --bind 0.0.0.0:8000
      --max-requests 4000
      --max-requests-jitter 400
      --timeout 60
      --graceful-timeout 30
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
      - ./geo-data:/app/src/geo/data
      - ./sentinel:/app/src/questionnaires/llms/sentinel
      - ./certs:/app/certs:ro
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthcheck', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-12g}
          cpus: ${WEB_CPU_LIMIT:-6.0}

  celery_default:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    stop_grace_period: 300s  # Match CELERY_TASK_TIME_LIMIT so running tasks can finish
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A revel worker --loglevel=INFO --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=1000 --hostname=worker-default@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
      - ./geo-data:/app/src/geo/data
      - ./sentinel:/app/src/questionnaires/llms/sentinel
      - ./certs:/app/certs:ro
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A revel inspect ping -d worker-default@$(hostname) --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${CELERY_MEM_LIMIT:-8g}
          cpus: ${CELERY_CPU_LIMIT:-4.0}

  beat:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    container_name: revel_beat
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A revel beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=INFO
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  telegram:
    image: ghcr.io/letsrevel/revel:latest
    profiles: ["telegram"]
    restart: always
    container_name: revel_telegram
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: python manage.py run_telegram_bot
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  frontend:
    image: ghcr.io/letsrevel/revel-frontend:latest
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"
      # Internal-only Prometheus metrics (prom-client). Reachable on revel_network
      # for the `frontend` scrape job; Caddy never routes to it. revel-frontend #400
      - "9091"
    env_file:
      - .env
    environment:
      # adapter-node: derive event.getClientAddress() from the header Caddy
      # sets on the frontend proxy (the real Cloudflare-resolved visitor IP).
      - ADDRESS_HEADER=x-real-ip
      # SSR API calls skip Cloudflare/Caddy and go straight to Django over the
      # internal network, forwarding the visitor IP via X-Real-IP (handleFetch
      # in the frontend). Unset to fall back to the public API URL. backend#487
      - INTERNAL_API_URL=http://web:8000
      # Public API origin the browser calls, and the frontend's own public
      # origin. Read at RUNTIME by the frontend (revel-frontend#396), so the
      # prebuilt image retargets without a rebuild. Wired from the API/frontend
      # base URLs already defined in .env.
      - PUBLIC_API_URL=${BASE_URL}
      - ORIGIN=${FRONTEND_BASE_URL}
    networks:
      - revel_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000', r => r.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEM_LIMIT:-2g}
          cpus: '1.0'

  # ============================================================================
  # Database Services
  # ============================================================================

  revel_postgres:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: revel_postgres
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-4GB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-16GB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=${PG_WORK_MEM:-32MB}
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
    volumes:
      - revel_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    # Pinned, and previously untagged entirely — every pull silently took
    # whatever `latest` pointed at, for the pooler every DB connection goes
    # through. Same reasoning as caddy above: bump deliberately.
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: always
    container_name: revel_pgbouncer
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: revel_postgres
      DB_NAME: ${DB_NAME}
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      ADMIN_USERS: ${DB_USER}
    expose:
      - "6432"
    networks:
      - revel_network
    depends_on:
      revel_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # ============================================================================
  # Cache & Message Broker
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: revel_redis
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --maxclients 10000
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-1g}
          cpus: '1.0'

  redis-exporter:
    image: oliver006/redis_exporter:latest
    profiles: ["observability"]
    container_name: revel_redis_exporter
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REDIS_ADDR: redis:6379
    expose:
      - "9121"
    networks:
      - revel_network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  # ============================================================================
  # Observability Stack
  # ============================================================================

  loki:
    image: grafana/loki:3.0.0
    profiles: ["observability"]
    container_name: revel_loki
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${LOKI_MEM_LIMIT:-1g}
          cpus: ${LOKI_CPU_LIMIT:-2.0}

  tempo:
    image: grafana/tempo:2.5.0
    profiles: ["observability"]
    container_name: revel_tempo
    restart: always
    user: root
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${TEMPO_MEM_LIMIT:-512m}
          cpus: ${TEMPO_CPU_LIMIT:-2.0}

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    container_name: revel_prometheus
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./observability/prometheus-config.yml:/etc/prometheus/prometheus.yml
      - ./observability/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - revel_network
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-2g}
          cpus: ${PROMETHEUS_CPU_LIMIT:-1.0}

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["observability"]
    container_name: revel_alertmanager
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager:9093'
    volumes:
      - ./observability/alertmanager-config.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./observability/alertmanager-entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    environment:
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY:-}
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN:-}
    expose:
      - "9093"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: ["observability"]
    container_name: revel_postgres_exporter
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@revel_postgres:5432/${DB_NAME}?sslmode=disable"
    expose:
      - "9187"
    networks:
      - revel_network
    depends_on:
      revel_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    profiles: ["observability"]
    container_name: revel_blackbox_exporter
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "9115"
    networks:
      - revel_network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  # Host metrics (CPU, memory, disk, load, network) for the Hetzner box.
  # Reads the host's /proc, /sys and / read-only; scraped by Prometheus as
  # job "node" on node_exporter:9100. Never exposed off revel_network.
  node_exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["observability"]
    container_name: revel_node_exporter
    restart: always
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    pid: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - revel_network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  # Synthetic login canary — real login through the public edge every 10 min,
  # exposing canary_login_last_success_timestamp_seconds for CanaryLoginFailed.
  # Stdlib-only script bind-mounted into a plain python image (no build needed).
  # Credentials come from .env (CANARY_EMAIL / CANARY_PASSWORD); the account must
  # have 2FA disabled. See canary/login_canary.py.
  canary:
    image: python:3.13-slim
    profiles: ["canary"]
    container_name: revel_canary
    restart: always
    command: ["python", "-u", "/app/login_canary.py"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./canary/login_canary.py:/app/login_canary.py:ro
    environment:
      CANARY_BASE_URL: ${CANARY_BASE_URL:-https://letsrevel.io}
      CANARY_EMAIL: ${CANARY_EMAIL:-}
      CANARY_PASSWORD: ${CANARY_PASSWORD:-}
      CANARY_INTERVAL: ${CANARY_INTERVAL:-600}
    expose:
      - "8080"
    networks:
      - revel_network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  pyroscope:
    image: grafana/pyroscope:1.9.0
    profiles: ["profiling"]
    container_name: revel_pyroscope
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pyroscope_data:/var/lib/pyroscope
    environment:
      - PYROSCOPE_LOG_LEVEL=info
    expose:
      - "4040"
    networks:
      - revel_network
    deploy:
      resources:
        limits:
          memory: ${PYROSCOPE_MEM_LIMIT:-512m}
          cpus: ${PYROSCOPE_CPU_LIMIT:-2.0}

  alloy:
    image: grafana/alloy:v1.2.0
    profiles: ["observability"]
    container_name: revel_alloy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./observability/alloy-logs-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    environment:
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-production}
      - HOSTNAME=${HOSTNAME:-revel-production}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    expose:
      - "12345"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${ALLOY_MEM_LIMIT:-512m}
          cpus: ${ALLOY_CPU_LIMIT:-1.0}

  alloy-profiling:
    image: grafana/alloy:v1.2.0
    profiles: ["profiling"]
    container_name: revel_alloy_profiling
    restart: always
    cap_add:
      - BPF
      - PERFMON
      - SYS_PTRACE
      - SYS_RESOURCE
      - DAC_READ_SEARCH
      - CHECKPOINT_RESTORE
      - SYSLOG
      - SYS_ADMIN
    pid: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./observability/alloy-profiling-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - alloy_profiling_data:/var/lib/alloy
    environment:
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-production}
      - HOSTNAME=${HOSTNAME:-revel-production}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    expose:
      - "12345"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${ALLOY_PROFILING_MEM_LIMIT:-512m}
          cpus: ${ALLOY_PROFILING_CPU_LIMIT:-1.0}

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    container_name: revel_grafana
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://${GRAFANA_DOMAIN:-grafana.letsrevel.io}
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # Land on the system-health overview the moment anyone logs in.
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/revel-health-overview.json
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana-dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - revel_network
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-2g}
          cpus: ${GRAFANA_CPU_LIMIT:-1.0}

  # ============================================================================
  # Security
  # ============================================================================

  clamav:
    image: clamav/clamav:latest
    profiles: ["antivirus"]
    container_name: revel_clamav
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3310"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    environment:
      - CLAMD_CONF_MaxFileSize=256M
      - CLAMD_CONF_StreamMaxLength=256M
      - FRESHCLAM_CONF_Checks=24
    volumes:
      - clamav_data:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

volumes:
  caddy_data:
  caddy_config:
  revel_postgres_data:
  redis_data:
  clamav_data:
  loki_data:
  tempo_data:
  prometheus_data:
  alertmanager_data:
  pyroscope_data:
  alloy_data:
  alloy_profiling_data:
  grafana_data:

networks:
  revel_network:
    driver: bridge
