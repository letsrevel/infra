services:
  # ============================================================================
  # Reverse Proxy
  # ============================================================================

  caddy:
    image: caddy:latest
    container_name: revel_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - ./media:/srv/revel_media
    networks:
      - revel_network

  # ============================================================================
  # Application Services
  # ============================================================================

  web:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    container_name: revel_web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      gunicorn revel.wsgi:application
      --worker-class gthread
      --workers 6
      --threads 4
      --bind 0.0.0.0:8000
      --max-requests 4000
      --max-requests-jitter 400
      --timeout 60
      --graceful-timeout 30
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
      - ./geo-data:/app/src/geo/data
      - ./sentinel:/app/src/questionnaires/llms/sentinel
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 12g
          cpus: '6.0'
        reservations:
          memory: 4g
          cpus: '2.0'

  celery_default:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    container_name: revel_celery_default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A revel worker --loglevel=INFO --concurrency=4 --max-tasks-per-child=1000 --hostname=worker-default@%h
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
      - ./geo-data:/app/src/geo/data
      - ./sentinel:/app/src/questionnaires/llms/sentinel
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A revel inspect ping -d worker-default@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8g
          cpus: '4.0'
        reservations:
          memory: 2g
          cpus: '1.0'

  beat:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    container_name: revel_beat
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: celery -A revel beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=INFO
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  flower:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    container_name: revel_flower
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      celery -A revel flower
      --port=5555
    expose:
      - "5555"
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5555/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  telegram:
    image: ghcr.io/letsrevel/revel:latest
    restart: always
    container_name: revel_telegram
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: python manage.py run_telegram_bot
    env_file:
      - .env
    volumes:
      - ./media:/app/src/media
    networks:
      - revel_network
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  frontend:
    image: ghcr.io/letsrevel/revel-frontend:latest
    restart: always
    container_name: revel_frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3000"
    env_file:
      - .env
    networks:
      - revel_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  # ============================================================================
  # Database Services
  # ============================================================================

  revel_postgres:
    image: postgis/postgis:17-3.5
    restart: always
    container_name: revel_postgres
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command: >
      postgres
      -c shared_buffers=4GB
      -c effective_cache_size=16GB
      -c maintenance_work_mem=1GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=32MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c max_connections=100
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
    volumes:
      - revel_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer
    restart: always
    container_name: revel_pgbouncer
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: revel_postgres
      DB_NAME: ${DB_NAME}
      LISTEN_PORT: 6432
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      ADMIN_USERS: ${DB_USER}
    expose:
      - "6432"
    networks:
      - revel_network
    depends_on:
      revel_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 6432"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # ============================================================================
  # Cache & Message Broker
  # ============================================================================

  redis:
    image: redis:7-alpine
    container_name: revel_redis
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --save 900 1
      --save 300 10
      --save 60 10000
      --tcp-backlog 511
      --timeout 300
      --tcp-keepalive 60
      --maxclients 10000
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: revel_redis_exporter
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REDIS_ADDR: redis:6379
    expose:
      - "9121"
    networks:
      - revel_network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.25'

  # ============================================================================
  # Observability Stack
  # ============================================================================

  loki:
    image: grafana/loki:3.0.0
    container_name: revel_loki
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    expose:
      - "3100"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '2.0'

  tempo:
    image: grafana/tempo:2.5.0
    container_name: revel_tempo
    restart: always
    user: root
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo/tempo.yaml
      - tempo_data:/var/tempo
    expose:
      - "3200"
      - "4317"
      - "4318"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '2.0'

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: revel_prometheus
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./observability/prometheus-config.yml:/etc/prometheus/prometheus.yml
      - ./observability/alerts:/etc/prometheus/alerts
      - prometheus_data:/prometheus
    expose:
      - "9090"
    networks:
      - revel_network
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: revel_alertmanager
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager:9093'
    volumes:
      - ./observability/alertmanager-config.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./observability/alertmanager-entrypoint.sh:/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    environment:
      PUSHOVER_USER_KEY: ${PUSHOVER_USER_KEY}
      PUSHOVER_APP_TOKEN: ${PUSHOVER_APP_TOKEN}
    expose:
      - "9093"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: revel_postgres_exporter
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@revel_postgres:5432/${DB_NAME}?sslmode=disable"
    expose:
      - "9187"
    networks:
      - revel_network
    depends_on:
      revel_postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: revel_blackbox_exporter
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "9115"
    networks:
      - revel_network
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'

  pyroscope:
    image: grafana/pyroscope:1.9.0
    container_name: revel_pyroscope
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pyroscope_data:/var/lib/pyroscope
    environment:
      - PYROSCOPE_LOG_LEVEL=info
    expose:
      - "4040"
    networks:
      - revel_network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '2.0'

  alloy:
    image: grafana/alloy:latest
    container_name: revel_alloy
    restart: always
    privileged: true
    pid: host
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    environment:
      - DEPLOYMENT_ENVIRONMENT=${DEPLOYMENT_ENVIRONMENT:-production}
      - HOSTNAME=${HOSTNAME:-revel-production}
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
      - --server.http.listen-addr=0.0.0.0:12345
    expose:
      - "12345"
    networks:
      - revel_network
    depends_on:
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:12345/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '1.0'

  grafana:
    image: grafana/grafana:11.1.0
    container_name: revel_grafana
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.letsrevel.io
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./observability/grafana-dashboard-provisioning.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./observability/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - revel_network
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  # ============================================================================
  # Security
  # ============================================================================

  clamav:
    image: clamav/clamav:latest
    container_name: revel_clamav
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "3310"
    networks:
      - revel_network
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version || exit 1"]
      interval: 1m
      timeout: 10s
      retries: 3
    environment:
      - CLAMD_CONF_MaxFileSize=256M
      - CLAMD_CONF_StreamMaxLength=256M
      - FRESHCLAM_CONF_Checks=24
    volumes:
      - clamav_data:/var/lib/clamav
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

volumes:
  caddy_data:
  caddy_config:
  revel_postgres_data:
  redis_data:
  clamav_data:
  loki_data:
  tempo_data:
  prometheus_data:
  alertmanager_data:
  pyroscope_data:
  alloy_data:
  grafana_data:

networks:
  revel_network:
    driver: bridge
