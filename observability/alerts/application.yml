groups:
  - name: application
    interval: 30s
    rules:
      # ========================================================================
      # Application Health Alerts
      # ========================================================================

      # Application Down
      - alert: ApplicationDown
        expr: probe_success{job="healthcheck"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application healthcheck is failing"
          description: "The application at {{ $labels.instance }} has been unhealthy for more than 2 minutes."

      # High HTTP Error Rate
      - alert: HighHTTPErrorRate
        expr: (sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m])) / sum(rate(django_http_responses_total_by_status_total[5m]))) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate"
          description: "HTTP 5xx error rate is {{ $value }}% over the last 5 minutes."

      # High HTTP 4xx Rate
      - alert: HighHTTP4xxRate
        expr: (sum(rate(django_http_responses_total_by_status_total{status=~"4.."}[5m])) / sum(rate(django_http_responses_total_by_status_total[5m]))) * 100 > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 4xx error rate"
          description: "HTTP 4xx error rate is {{ $value }}% over the last 10 minutes."

      # Slow HTTP Requests
      - alert: SlowHTTPRequests
        expr: histogram_quantile(0.95, rate(django_http_requests_latency_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow HTTP request latency"
          description: "95th percentile latency is {{ $value }}s, exceeding 2 seconds threshold."

      # High Request Rate
      - alert: HighRequestRate
        expr: sum(rate(django_http_requests_total[5m])) > 1000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "High request rate detected"
          description: "Application is receiving {{ $value }} requests/second."

      # ========================================================================
      # Security Alerts
      # ========================================================================

      # ClamAV Down
      - alert: ClamAVDown
        expr: up{job="clamav"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ClamAV antivirus service is down"
          description: "ClamAV has been down for more than 5 minutes. File scanning is disabled."

      # High Authentication Failure Rate
      - alert: HighAuthenticationFailureRate
        expr: rate(django_http_responses_total_by_view_transport_method_total{view=~".*login.*",status="401"}[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High authentication failure rate"
          description: "Detecting {{ $value }} failed login attempts per second. Possible brute force attack."

      # Elevated Rate-Limiting (HTTP 429) — widespread throttling only
      #
      # Anonymous throttles key on the Cloudflare edge IP (see infra#3, backend#479),
      # so legitimate users behind a shared Cloudflare egress IP can be throttled
      # collectively. THAT is the actionable case this alert targets.
      #
      # We want to avoid paging on a single low-rate noisy client (one scraper/bot
      # tripping its own per-IP bucket): the throttle is doing its job, and one
      # IP is handled out-of-band (Cloudflare IP block). This metric has NO IP
      # label, so we cannot distinguish clients directly — instead we approximate
      # "broad impact" with two conditions that a low-rate client won't meet:
      #   1. 429s are a meaningful SHARE of all responses (>10%), and
      #   2. the absolute 429 rate clears a floor (>1/s ≈ 60/min sustained).
      # Both must hold for 5m. Caveat: a single *aggressive* client (>1/s of 429s
      # against low total traffic) can still trip this — true per-client detection
      # needs a Loki alert keyed on ip_address. Self-clears ~5m after a burst ends,
      # so it won't linger and re-notify (warning route repeats every 2h).
      - alert: ElevatedRateLimiting
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status="429"}[5m]))
            /
            sum(rate(django_http_responses_total_by_status_total[5m]))
          ) > 0.10
          and
          sum(rate(django_http_responses_total_by_status_total{status="429"}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Widespread HTTP 429 (rate-limit) responses"
          description: "{{ $value | humanizePercentage }} of all responses are 429s (and >1/s) over 5m — broad throttling. Likely a shared Cloudflare-edge-IP bucket hitting real users, or abuse (note: a single aggressive client can also trip this — confirm via per-IP logs). Triage runbook: docs/runbooks/rate-limit-429s.md"

      # ========================================================================
      # Money-Correctness Alerts (Stripe)
      #
      # These fire on a SINGLE occurrence — each increment means a real person
      # may have paid for something we did not issue, and recovery is manual and
      # time-sensitive. No `for:` delay; severity=critical so Pushover uses
      # emergency priority (bypasses quiet hours, requires acknowledgment,
      # retries every 60s) — a human sees it out of hours.
      #
      # IMPORTANT — presence, not rate: production gunicorn workers each keep
      # their own registry (no PROMETHEUS_MULTIPROC_DIR — backend#757), so a
      # scrape reaches one worker. `increase(...) > 0` is sound (the incremented
      # worker holds its non-zero value until it is eventually scraped), but
      # exact rates and counts are NOT — do not rewrite these as rate or
      # threshold alerts.
      #
      # Runbook: revel-backend docs/guides/observability.md (money-correctness),
      # which documents these rules verbatim. Each increment is paired with a
      # self-contained ERROR log line carrying the identifiers to recover the buyer.
      # ========================================================================

      # Stripe's session total disagreed with sum(Payment.amount)
      - alert: StripeSessionTotalMismatch
        expr: increase(revel_stripe_session_total_mismatch_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Stripe session total mismatch (call_site={{ $labels.call_site }})"
          description: "Stripe's session total disagreed with sum(Payment.amount) at call_site={{ $labels.call_site }}. call_site=webhook means the buyer HAS been charged; call_site=preflight was caught before the session existed (nobody charged). Recover the buyer using the paired ERROR log line. Runbook: revel-backend docs/guides/observability.md (money-correctness)."

      # A session that captured money was confirmed with no Payment rows to confirm it
      - alert: StripeSessionPaidWithoutPayments
        expr: increase(revel_stripe_session_paid_without_payments_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Stripe session paid without Payment records"
          description: "A Stripe session that captured money was confirmed with no Payment rows — the buyer was charged and we have no record. Recover the buyer using the paired ERROR log line. Runbook: revel-backend docs/guides/observability.md (money-correctness)."

      # ========================================================================
      # Business Logic Alerts
      # ========================================================================

      # Low Active Users
      - alert: LowActiveUsers
        expr: sum(increase(django_http_requests_total[1h])) < 100
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "Low user activity detected"
          description: "Only {{ $value }} requests in the last hour."

      # High User Registration Rate
      - alert: HighUserRegistrationRate
        expr: rate(django_http_responses_total_by_view_transport_method_total{view=~".*register.*",status="200"}[5m]) > 5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "High user registration rate"
          description: "Detecting {{ $value }} registrations per second. Verify if legitimate."

      # ========================================================================
      # Integration Alerts
      # ========================================================================

      # High External API Error Rate
      - alert: HighExternalAPIErrorRate
        expr: rate(django_http_requests_exceptions_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High rate of exceptions in external API calls"
          description: "Detecting {{ $value }} exceptions per second when calling external APIs."

      # Telegram Bot Issues
      - alert: TelegramBotDown
        expr: up{container_label_com_docker_compose_service="telegram"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Telegram bot service is down"
          description: "Telegram bot has been down for more than 5 minutes."
