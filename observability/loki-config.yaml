auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 512

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Ruler: evaluates LogQL alert rules and sends them to Alertmanager.
# With auth_enabled: false the tenant is "fake", so rule files live in
# /loki/rules-local/fake/ (see docker-compose.yml volume mount).
ruler:
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  storage:
    type: local
    local:
      directory: /loki/rules-local
  rule_path: /loki/rules-tmp
  evaluation_interval: 1m

# Retention
limits_config:
  retention_period: 720h  # 30 days
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 15m
  max_query_parallelism: 64
  max_streams_per_user: 0
  max_global_streams_per_user: 0
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 200

# Compaction
compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem
